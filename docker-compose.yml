services:
  db:
    image: postgres:16-alpine
    container_name: smartkos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartkos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SmartKosSecure2026!}
      POSTGRES_DB: ${POSTGRES_DB:-smartkos}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    command: postgres -c shared_buffers=64MB -c max_connections=40 -c work_mem=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartkos} -d ${POSTGRES_DB:-smartkos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smartkos-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartkos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-smartkos}:${POSTGRES_PASSWORD:-SmartKosSecure2026!}@db:5432/${POSTGRES_DB:-smartkos}
      TZ: Asia/Jakarta
      DB_TELEMETRY_INTERVAL_SEC: ${DB_TELEMETRY_INTERVAL_SEC:-15}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      DEFAULT_DEVICE_ID: ${DEFAULT_DEVICE_ID:-esp32-kamar-01}
    volumes:
      - ./website/ai:/app/website/ai
    networks:
      - smartkos-net

volumes:
  pgdata:
    driver: local

networks:
  smartkos-net:
    driver: bridge
