name: Deploy to VPS (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub

jobs:
  deploy:
    name: Auto Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 20220 }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            echo "🚀 Memulai proses deployment di VPS..."
            cd /root/smart-kamar-kos

            echo "📥 Mengambil perubahan terbaru dari branch main..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Memperbarui dan menjalankan ulang container aplikasi..."
            cd deploy
            docker compose build app
            docker compose up -d app

            echo "✅ Deployment berhasil! Layanan sudah aktif dengan versi terbaru."
